ont-size:13px;font-weight:850}.focus-daily strong{font:italic 36px Georgia,serif}.mobilebar{display:none}

const notes=[
 {id:'math-1',s:'math',title:'미분계수와 도함수',lead:'미분은 함수가 한순간에 얼마나 빠르게 변하는지를 알아보는 도구야.',points:['미분계수는 한 점에서 접선의 기울기를 나타내.','도함수는 각 x에서의 미분계수를 함수로 나타낸 거야.','다항함수 xⁿ을 미분하면 nxⁿ⁻¹이 돼.'],formula:'f′(x) = lim[h→0] (f(x+h)−f(x)) / h',example:'f(x)=x²−3x+1이면 f′(x)=2x−3이야. 따라서 x=2에서의 미분계수는 1이야.',tip:'주의: 미분가능하면 연속이지만, 연속이라고 반드시 미분가능한 건 아니야.'},
 {id:'math-2',s:'math',title:'조건부확률과 독립',lead:'어떤 사건이 일어났다는 정보를 알고 나서 확률을 새로 계산하는 방법이야.',points:['P(B)>0일 때 P(A|B)=P(A∩B)/P(B)야.','A와 B가 독립이면 P(A∩B)=P(A)P(B)야.','독립과 배반은 다른 개념이야.'],formula:'P(A | B) = P(A ∩ B) / P(B)',example:'동전을 두 번 던질 때 첫 번째가 앞면이라는 조건에서 두 번째도 앞면일 확률은 1/2이야.',tip:'주의: P(A∩B)=0인 배반사건은 확률이 둘 다 양수라면 독립일 수 없어.'},
 {id:'math-3',s:'math',title:'등차수열의 일반항',lead:'앞뒤 항의 차이가 항상 일정한 수열을 등차수열이라고 해.',points:['일정한 차이를 공차 d라고 해.','첫째항을 a라고 하면 n번째 항은 a+(n−1)d야.','항의 개수를 세는 과정에서 n−1을 놓치기 쉬워.'],formula:'aₙ = a + (n−1)d',example:'2, 5, 8, …의 10번째 항은 2+9×3=29야.',tip:'빠른 확인: 실제로 2번째 항에 n=2를 대입해 봐.'},
 {id:'physics-1',s:'physics',title:'뉴턴의 운동 법칙',lead:'물체의 운동이 왜 변하는지를 힘과 질량으로 설명하는 핵심 원리야.',points:['합력이 0이면 속도가 변하지 않아.','질량이 일정할 때 합력은 질량×가속도야.','힘과 가속도의 방향은 같아.'],formula:'F = ma',example:'질량이 2 kg인 물체에 10 N의 알짜힘이 작용하면 가속도 크기는 5 m/s²야.',tip:'주의: 속도와 힘이 항상 같은 방향인 것은 아니야.'},
 {id:'physics-2',s:'physics',title:'옴의 법칙',lead:'도체의 전압, 전류, 저항을 연결해 주는 간단하지만 강력한 식이야.',points:['저항이 일정할 때 전압은 전류에 비례해.','전압의 단위는 V, 전류는 A, 저항은 Ω이야.','직렬 연결에서는 전류가 같고, 병렬 연결에서는 전압이 같아.'],formula:'V = IR',example:'저항 4 Ω에 12 V를 걸면 전류는 3 A야.',tip:'주의: 모든 소자가 일정한 저항을 갖는 건 아니어서 적용 조건을 확인해야 해.'},
 {id:'physics-3',s:'physics',title:'파동의 속력',lead:'파동은 공간을 통해 에너지를 전달하고, 진동수와 파장이 속력을 결정해.',points:['파장은 이웃한 같은 위상 지점 사이 거리야.','진동수는 1초당 진동 횟수이고 단위는 Hz야.','파동이 다른 매질로 들어가면 진동수는 유지되고 속력과 파장이 바뀔 수 있어.'],formula:'v = fλ',example:'소리의 속력이 340 m/s이고 진동수가 170 Hz이면 파장은 2 m야.',tip:'기억법: 속력 = 1초 동안 지나가는 파장의 개수 × 한 파장의 길이.'},
 {id:'chemistry-1',s:'chemistry',title:'몰과 몰질량',lead:'너무 작은 입자들을 일일이 셀 수 없으니까 화학에서는 ‘몰’이라는 묶음을 사용해.',points:['1 mol은 정확히 6.02214076×10²³개 입자에 해당해.','몰질량은 1 mol의 질량이며 단위는 g/mol이야.','물질량(mol)=질량(g)/몰질량(g/mol)이야.'],formula:'n = m / M',example:'물 H₂O의 몰질량은 약 18 g/mol이므로 물 36 g은 약 2 mol이야.',tip:'주의: 원자량과 분자량은 상대적인 값이고, 몰질량에는 단위가 있어.'},
 {id:'chemistry-2',s:'chemistry',title:'원자와 이온',lead:'원자에 전자가 들어오거나 나가면 전하를 띤 이온이 돼.',points:['원자번호는 양성자 수야.','중성 원자는 양성자 수와 전자 수가 같아.','양이온은 전자를 잃은 상태, 음이온은 전자를 얻은 상태야.'],formula:'이온 전하 = 양성자 수 − 전자 수',example:'나트륨 원자는 양성자 11개, 전자 11개이고 Na⁺는 전자가 10개야.',tip:'주의: 이온이 되어도 원자핵의 양성자 수는 바뀌지 않아.'},
 {id:'chemistry-3',s:'chemistry',title:'pH와 수소 이온',lead:'pH는 수용액의 수소 이온 농도를 로그로 표현한 척도야.',points:['pH가 1 작아지면 수소 이온 농도는 10배 커져.','25 ℃의 묽은 수용액에서 pH 7은 중성이야.','pH가 2 차이 나면 수소 이온 농도는 100배 차이 나.'],formula:'pH = −log₁₀[H⁺]',example:'pH 3인 용액은 pH 5인 용액보다 수소 이온 농도가 100배 커.',tip:'주의: pH 3이 pH 6보다 세 배 더 산성이라고 표현하면 틀려.'},
 {id:'coding-1',s:'coding',title:'C언어 배열과 인덱스',lead:'같은 자료형의 값을 연속된 공간에 저장할 때 배열을 사용해.',points:['int a[5]는 정수 5개를 담는 배열이야.','첫 번째 원소는 a[0], 마지막 원소는 a[4]야.','배열 범위를 벗어난 접근은 정의되지 않은 동작을 일으켜.'],formula:'int a[3] = {10, 20, 30};  // a[1]은 20',example:'a[0]+a[2]는 10+30=40이야.',tip:'주의: C언어의 배열 인덱스는 1이 아니라 0부터 시작해.'},
 {id:'coding-2',s:'coding',title:'반복문과 정수 나눗셈',lead:'반복문은 같은 규칙을 여러 번 실행할 수 있도록 도와줘.',points:['for 문은 초기식 → 조건식 → 본문 → 증감식의 흐름으로 진행돼.','정수끼리 / 연산을 하면 결과에서 소수 부분이 잘려 나가.','반복 횟수를 셀 때 시작값과 종료 조건을 함께 봐야 해.'],formula:'for (int i=0; i<4; i++) { /* 4회 */ }',example:'printf("%d", 7/2);의 출력은 3이야.',tip:'주의: i<4와 i<=4는 반복 횟수가 한 번 달라.'},
 {id:'coding-3',s:'coding',title:'First-Fit 메모리 할당',lead:'메모리에서 요청 크기를 담을 수 있는 첫 빈 공간을 찾아 할당하는 방법이야.',points:['주소 순서대로 빈 공간을 검사해.','요청 크기 이상의 연속 빈 공간을 처음 발견하면 배치해.','빈칸의 총합이 충분해도 연속 공간이 작으면 할당이 실패할 수 있어.'],formula:'첫 번째 ‘충분히 큰 연속 빈 구간’에 배치',example:'빈 구간이 2칸, 4칸, 3칸 순서라면 3칸 요청은 두 번째 구간에 들어가.',tip:'주의: First-Fit은 가장 작은 구간을 고르는 Best-Fit과 달라.'},
 {id:'korean-1',s:'korean',title:'문장의 구성 성분',lead:'문장 속 단어와 어절이 맡는 역할을 분석하면 문장의 구조가 보여.',points:['주어는 서술어의 주체를 나타내는 성분이야.','목적어는 타동사가 나타내는 동작의 대상이야.','관형어는 체언을 꾸며 주는 성분이야.'],formula:'나는 / 새 책을 / 읽었다.',example:'위 문장에서 ‘나는’은 주어, ‘새’는 관형어, ‘책을’은 목적어야.',tip:'주의: 조사 하나가 달라지면 문장성분도 달라질 수 있어.'},
 {id:'korean-2',s:'korean',title:'소설의 시점',lead:'누가 이야기를 전달하느냐에 따라 독자가 알 수 있는 정보가 달라져.',points:['1인칭 주인공 시점은 주인공이 자신의 이야기를 전달해.','1인칭 관찰자 시점은 주변 인물의 행동을 주로 관찰해.','3인칭 전지적 시점은 여러 인물의 내면까지 전달할 수 있어.'],formula:'누가 말하나? → 무엇까지 아나?',example:'“나는 그날의 실수를 잊지 못한다.”처럼 ‘나’가 자신의 경험을 말하면 1인칭 주인공 시점일 수 있어.',tip:'주의: ‘나’가 등장한다는 사실만으로 시점을 단정하지 말고 화자의 역할을 봐.'},
 {id:'korean-3',s:'korean',title:'반어와 역설',lead:'겉으로 보이는 표현과 실제 의미의 관계를 활용하는 수사법이야.',points:['반어는 겉으로 한 말과 실제 의도가 반대인 표현이야.','역설은 모순돼 보이는 말로 진실이나 의미를 드러내는 표현이야.','두 표현 모두 독자의 주의를 환기할 수 있어.'],formula:'반어 ≠ 역설',example:'시험을 망친 상황에서 “참 잘했다!”라고 비꼬면 반어적인 표현이야.',tip:'주의: 글의 맥락이 없으면 반어인지 확정하기 어려운 문장도 있어.'},
 {id:'english-1',s:'english',title:'가정법 과거',lead:'현재 사실과 다른 상황을 상상할 때 사용하는 표현이야.',points:['If절은 주로 과거형, 주절은 would/could/might+동사원형을 써.','be동사는 격식 있는 가정법에서 주어와 관계없이 were를 쓸 수 있어.','형태가 과거라고 해서 과거의 일을 말하는 건 아니야.'],formula:'If + 주어 + 과거형, 주어 + would + 동사원형',example:'If I were you, I would study a little every day.',tip:'주의: 현실과 다른 현재의 상상인지 먼저 확인해.'},
 {id:'english-2',s:'english',title:'현재완료와 시간 표현',lead:'과거의 일이 현재와 연결될 때 현재완료를 활용해.',points:['형태는 have/has + 과거분사야.','since는 시작 시점, for는 지속 기간과 함께 쓰는 경우가 많아.','현재완료는 경험·계속·완료·결과의 의미로 쓰여.'],formula:'have / has + p.p.',example:'She has lived here since 2020. (2020년부터 지금까지 살아왔다.)',tip:'주의: 특정한 과거 시점을 나타내는 yesterday와는 보통 단순과거를 사용해.'},
 {id:'english-3',s:'english',title:'수동태',lead:'행동을 누가 했는지보다 무엇이 어떻게 되었는지에 초점을 둘 때 써.',points:['기본 형태는 be동사 + 과거분사야.','능동태의 목적어가 수동태에서는 주어가 될 수 있어.','행위자를 밝히고 싶으면 by + 행위자를 사용할 수 있어.'],formula:'be + p.p. (+ by ...)',example:'Mina wrote the letter. → The letter was written by Mina.',tip:'주의: 시제에 따라 be동사의 형태가 달라져.'}
];

const DAY=()=>new Date().toLocaleDateString('en-CA');
const INIT_TASKS=()=>[{id:'task-a',text:'개념 한 편 읽기',done:false},{id:'task-b',text:'문제 다섯 개 풀기',done:false},{id:'task-c',text:'집중 타이머 한 번 완료하기',done:false}];
const key='study-atelier-v1';
function load(){try{return JSON.parse(localStorage.getItem(key))||{}}catch(e){return {}}}
let saved=load();let data={date:DAY(),tasks:INIT_TASKS(),answered:0,correct:0,focusToday:0,focusTotal:0,read:[],mistakes:{},...saved};
if(data.date!==DAY()){data.date=DAY();data.tasks=INIT_TASKS();data.focusToday=0;}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
save();
let view='home',subjectFilter='all',noteId=notes[0].id,quizState=null,quizMode='all',quizSubject='all';
let timerDuration=25*60,timerRemaining=25*60,timerRunning=false,timerEnd=0;
const $=sel=>document.querySelector(sel);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getSubject=id=>subjects.find(s=>s.id===id);
const dateString=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());
$('#todayLabel').textContent=dateString;
function navTo(v){view=v;if(v==='notes'){let n=notes.find(n=>n.id===noteId&&(subjectFilter==='all'||n.s===subjectFilter))||notes.find(n=>subjectFilter==='all'||n.s===subjectFilter);if(n){noteId=n.id;markRead(noteId)}}render();window.scrollTo({top:0,behavior:'smooth'})}
function updateSide(){const total=data.tasks.length,done=data.tasks.filter(t=>t.done).length;$('#sideProgress').textContent=total?`오늘 할 일 ${done} / ${total}개 완료`:'오늘 할 일을 적어 봐.';$('#sideProgressBar').style.width=total?`${done/total*100}%`:'0%';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
const sectionBar=(t,aside)=>`<div class="section-bar"><h2>${t}</h2><span>${aside||''}</span></div>`;
function footer(){return `<footer class="footnote"><span>공부의 모양 / STUDY ATELIER</span><span>작은 성취도 기록할 가치가 있어. · 기록은 이 브라우저에 저장돼.</span></footer>`}
function home(){let done=data.tasks.filter(t=>t.done).length;return `
<section class="hero"><div class="hero-copy"><div class="kicker">A little progress, every day</div><h1>오늘도,<br><span class="marker">한 문제씩.</span></h1><p>공부를 거창하게 시작할 필요는 없어.<br>개념 하나, 문제 하나, 그리고 조금 더 선명해진 머릿속.</p><div class="action-line"><button class="primary-btn" data-action="go-quiz">문제 풀러 가기 <span>↗</span></button><button class="plain-btn" data-view="notes">개념 먼저 읽기 →</button></div></div>
<div class="hero-art" aria-hidden="true"><div class="art-ring"></div><div class="paper-card"><span class="tiny-label">DAILY NOTES / 001</span><h3>Make it<br>make sense.</h3><div class="art-line"><span>□ 개념 하나 이해하기</span><i>↗</i></div><div class="art-line"><span>□ 틀려도 다시 풀기</span><i>↗</i></div><div class="art-line"><span>□ 오늘의 나 기록하기</span><i>↗</i></div><div class="art-stamp">LEARN<br>DAILY</div></div><div class="art-scribble">little by little ↗</div></div></section>
<div class="statline" aria-label="학습 기록"><div class="stat"><strong>${data.answered}</strong><span>누적 풀이 횟수</span></div><div class="stat"><strong>${data.read.length}</strong><span>읽은 개념 수</span></div><div class="stat"><strong>${data.focusToday}</strong><span>오늘 완료한 집중 세션</span></div></div>
<div class="bottom-grid"><section>${sectionBar('과목 서랍','SUBJECT INDEX — 06')}<div class="subject-list">${subjects.map((s,i)=>`<button class="subject-row" data-action="subject-notes" data-subject="${s.id}"><span class="subject-id">0${i+1}</span><strong>${s.name}</strong><small>${s.description}</small><span class="arrow">↗</span></button>`).join('')}</div></section>
<section>${sectionBar('오늘의 계획',`${done} / ${data.tasks.length} DONE`)}<div class="task-pad"><h3>작은 체크표.</h3><p class="helper">다 해내지 못해도 괜찮아. 일단 하나부터.</p><div>${data.tasks.length?data.tasks.map(t=>`<div class="task-item ${t.done?'done':''}"><input type="checkbox" data-task="${esc(t.id)}" aria-label="${esc(t.text)} 완료" ${t.done?'checked':''}><span>${esc(t.text)}</span><button class="task-del" type="button" aria-label="${esc(t.text)} 삭제" data-action="delete-task" data-task="${esc(t.id)}">×</button></div>`).join(''):'<p class="empty">아직 계획이 없어. 하나 적어 봐!</p>'}</div><form class="task-entry" id="taskForm"><input id="taskText" type="text" placeholder="새로운 할 일 쓰기" maxlength="70" aria-label="새 할 일"><button aria-label="할 일 추가" title="추가" type="submit">+</button></form></div></section></div>${footer()}`}
function filters(mode){return `<div class="filter-row" aria-label="과목 선택"><button data-action="filter" data-mode="${mode}" data-subject="all" class="${subjectFilter==='all'?'active':''}">전체 보기</button>${subjects.map(s=>`<button data-action="filter" data-mode="${mode}" data-subject="${s.id}" class="${subjectFilter===s.id?'active':''}">${s.name}</button>`).join('')}</div>`}
function notesPage(){let list=notes.filter(n=>subjectFilter==='all'||n.s===subjectFilter);if(!list.some(n=>n.id===noteId))noteId=list[0].id;let n=notes.find(n=>n.id===noteId),i=list.findIndex(a=>a.id===n.id);return `<header class="page-intro"><div class="kicker">Index 02 / Knowledge</div><h1>개념 서랍.</h1><p>많이 아는 것보다, 하나를 분명하게 이해하는 것부터.</p></header>${filters('notes')}<div class="notes-layout"><div class="index-list" aria-label="개념 목록">${list.map((a,k)=>`<button data-action="open-note" data-id="${a.id}" class="${a.id===noteId?'active':''}"><span>${String(k+1).padStart(2,'0')}</span><strong>${a.title}</strong></button>`).join('')}</div><article class="note-sheet"><div class="note-meta"><span>${getSubject(n.s).tag.toUpperCase()} / STUDY NOTE</span><span>${String(i+1).padStart(2,'0')} — ${String(list.length).padStart(2,'0')}</span></div><h2>${n.title}</h2><p class="note-lead">${n.lead}</p><div class="note-sub">기억할 포인트</div><ul>${n.points.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><div class="note-sub">핵심 공식 · 구조</div><div class="note-equation">${esc(n.formula)}</div><div class="note-sub">예시로 확인하기</div><div class="note-example">${esc(n.example)}</div><div class="note-tip"><strong>✳ 여기서 자주 실수해</strong><br>${esc(n.tip)}</div><div class="note-switch"><button class="small-ctrl" data-action="prev-note" ${i===0?'disabled':''}>← 이전 개념</button><button class="small-ctrl" data-action="next-note" ${i===list.length-1?'disabled':''}>다음 개념 →</button></div></article></div>${footer()}`}
function markRead(id){if(!data.read.includes(id)){data.read.push(id);save()}}
function startQuiz(sub='all',mode='all',specificIds=null){quizSubject=sub;quizMode=mode;let list=questions.filter(q=>specificIds?specificIds.includes(q.id):sub==='all'||q.s===sub);if(mode==='wrong'&&!specificIds)list=list.filter(q=>!!data.mistakes[q.id]);quizState={ids:[...list.map(q=>q.id)].sort(()=>Math.random()-.5),index:0,selected:null,score:0,done:false};navTo('quiz')}
function quizPage(){if(!quizState){return `<header class="page-intro"><div class="kicker">Index 03 / Practice</div><h1>문제 훈련.</h1><p>한 번에 다 맞히는 것보다, 이해할 때까지 다시 풀어 보는 게 더 중요해.</p></header><div class="filter-row"><button class="${quizSubject==='all'?'active':''}" data-action="quiz-select" data-subject="all">전체 과목</button>${subjects.map(s=>`<button class="${quizSubject===s.id?'active':''}" data-action="quiz-select" data-subject="${s.id}">${s.name}</button>`).join('')}</div><div class="empty-state"><div class="splash">Q.</div><h2>${quizSubject==='all'?'어떤 문제부터 풀까?':getSubject(quizSubject).name+' 문제 준비 완료'}</h2><p>과목별로 5문제씩, 총 ${questions.length}문제를 준비했어.<br>선택한 과목의 문제를 풀고 오답은 따로 모아 둘게.</p><button class="primary-btn" data-action="start-current">${quizSubject==='all'?'전체 과목 문제 시작':'선택한 과목 시작'} ↗</button></div>${footer()}`}
if(quizState.ids.length===0){return `<header class="page-intro"><div class="kicker">Index 03 / Practice</div><h1>문제 훈련.</h1></header><div class="empty-state"><h2>풀 문제가 없네!</h2><p>다른 과목을 선택하거나 새로운 문제를 시작해 봐.</p><button class="primary-btn" data-action="quiz-restart">다시 선택하기 →</button></div>`}
if(quizState.done){let pct=Math.round(quizState.score/quizState.ids.length*100);return `<header class="page-intro"><div class="kicker">Index 03 / Finished</div><h1>오늘도 한 장 끝.</h1><p>맞힌 문제도, 틀린 문제도 다음 공부의 재료가 돼.</p></header><div class="quiz-finish"><div class="big-number">${pct}<span style="font-size:35px;letter-spacing:-1px">%</span></div><h2>${quizState.score} / ${quizState.ids.length} 문제 정답</h2><p>${pct===100?'전부 맞혔어! 이제 개념을 더 확장해 봐.':'틀린 문제는 오답 보관함에 저장했어. 다시 보면 확실히 내 것이 될 거야.'}</p><div class="finish-actions"><button class="primary-btn" data-action="quiz-retry">다시 풀기 ↗</button><button class="small-ctrl" data-view="mistakes">오답 확인 →</button><button class="small-ctrl" data-action="quiz-restart">과목 변경</button></div></div>${footer()}`}
let idx=quizState.index,q=questions.find(q=>q.id===quizState.ids[idx]),selected=quizState.selected;return `<header class="page-intro"><div class="kicker">Index 03 / Practice</div><h1>문제 훈련.</h1><p>지금 이 문제 하나에만 집중해 봐.</p></header><div class="quiz-frame"><div class="quiz-top"><span>${getSubject(q.s).name} / QUESTION ${String(idx+1).padStart(2,'0')}</span><span>${idx+1} OF ${quizState.ids.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${(idx+(selected!==null?1:0))/quizState.ids.length*100}%"></div></div><div class="question-paper"><span class="qtag">Q. ${String(idx+1).padStart(2,'0')}</span><h2>${esc(q.q)}</h2><div class="choices">${q.opts.map((opt,i)=>`<button class="choice ${selected!==null?(i===q.a?'correct':i===selected?'incorrect':'muted'):''}" data-action="answer" data-option="${i}" ${selected!==null?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(opt)}</span></button>`).join('')}</div>${selected!==null?`<div class="explain"><strong class="${selected===q.a?'':'wrong-msg'}">${selected===q.a?'✓ 정답이야!':'↺ 아직 괜찮아, 여기서 알아 가면 돼.'}</strong><p>${esc(q.why)}</p><button class="primary-btn" data-action="next-question">${idx+1===quizState.ids.length?'결과 확인':'다음 문제'} <span>→</span></button></div>`:''}</div></div>${footer()}`}
function answer(option){if(!quizState||quizState.selected!==null||quizState.done)return;let q=questions.find(q=>q.id===quizState.ids[quizState.index]);quizState.selected=option;data.answered++;if(option===q.a){quizState.score++;data.correct++;if(data.mistakes[q.id])delete data.mistakes[q.id];}else{data.mistakes[q.id]={count:(data.mistakes[q.id]?.count||0)+1,at:DAY()}}save();render()}
function mistakesPage(){const list=questions.filter(q=>!!data.mistakes[q.id]);return `<header class="page-intro"><div class="kicker">Index 04 / Revisit</div><h1>오답 보관함.</h1><p>틀린 문제는 실패한 문제가 아니라, 다시 볼 이유가 생긴 문제야.</p></header>${list.length?`<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0"><span class="tiny-label">${list.length} QUESTIONS TO REVISIT</span><button class="primary-btn" data-action="review-all">전체 다시 풀기 ↗</button></div><div>${list.map((q,i)=>`<div class="mistake-row"><div class="no">${String(i+1).padStart(2,'0')}</div><div><small>${getSubject(q.s).name} · 틀린 횟수 ${data.mistakes[q.id].count}회</small><strong>${esc(q.q)}</strong></div><button data-action="review-one" data-id="${q.id}">다시 풀기 ↗</button></div>`).join('')}</div>`:`<div class="empty-state"><div class="splash">✓</div><h2>아직 보관된 오답이 없어.</h2><p>문제를 풀다가 틀리면 자동으로 여기에 모여.<br>맞혀서 복습에 성공한 문제는 목록에서 사라져.</p><button class="primary-btn" data-action="go-quiz">문제 풀러 가기 ↗</button></div>`}${footer()}`}
function focusPage(){return `<header class="page-intro"><div class="kicker">Index 05 / Deep Work</div><h1>집중의 시간.</h1><p>잠깐만 다른 창을 닫아 두고, 지금 해야 할 한 가지에 시간을 줘 보자.</p></header><div class="focus-grid"><div class="timer-area"><div class="timer-circle"><svg viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="46"/><circle class="active" id="timerArc" cx="55" cy="55" r="46"/></svg><div class="timer-readout"><strong id="timerClock">25:00</strong><small id="timerStatus">READY TO FOCUS</small></div></div><div class="timer-presets" role="group" aria-label="집중 시간">${[25,45,60].map(n=>`<button class="${timerDuration===n*60?'active':''}" data-action="set-time" data-minutes="${n}">${n}분</button>`).join('')}</div><div class="timer-controls"><button class="primary-btn" data-action="timer-toggle" id="timerToggle">${timerRunning?'잠깐 멈추기':'집중 시작'} ↗</button><button class="small-ctrl" data-action="timer-reset">처음으로 ↺</button></div></div><aside class="focus-side"><div class="note-block"><span class="tiny-label">AN UNCOMPLICATED PLAN</span><h3>딱 이것만.</h3><p>휴대폰을 잠시 내려놓고, 해야 할 공부 하나를 정해 봐. 타이머가 끝나면 세션이 기록돼. 다른 메뉴로 이동해도 현재 페이지가 열려 있는 동안은 계속 흘러가.</p></div><div class="focus-quote">“You don't have to see the whole staircase. Just take the next step.”</div><div class="focus-daily"><span>오늘 끝낸 집중 세션</span><strong>${data.focusToday}</strong></div><div style="margin-top:20px;font-size:12px;color:var(--muted);line-height:1.8">※ 타이머는 이 페이지가 열린 상태에서 작동해. 브라우저를 완전히 종료하면 진행 중인 세션은 복원되지 않아.</div></aside></div>${footer()}`}
function render(){updateSide();let page=view==='home'?home():view==='notes'?notesPage():view==='quiz'?quizPage():view==='mistakes'?mistakesPage():focusPage();$('#app').innerHTML=page;if(view==='focus')updateTimerUI()}
function setTimer(minutes){if(timerRunning)return;timerDuration=minutes*60;timerRemaining=timerDuration;render()}
function toggleTimer(){if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=false}else{if(timerRemaining<=0)timerRemaining=timerDuration;timerRunning=true;timerEnd=Date.now()+timerRemaining*1000}updateTimerUI()}
function resetTimer(){timerRunning=false;timerRemaining=timerDuration;updateTimerUI()}
function updateTimerUI(){const clock=$('#timerClock');if(!clock)return;let sec=Math.max(0,timerRemaining);clock.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;$('#timerArc').style.strokeDashoffset=String(289.027*(1-sec/timerDuration));$('#timerStatus').textContent=timerRunning?'FOCUS IN PROGRESS':sec===0?'SESSION FINISHED':'READY TO FOCUS';$('#timerToggle').textContent=timerRunning?'잠깐 멈추기 ↗':'집중 시작 ↗'}
setInterval(()=>{if(!timerRunning)return;timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if(timerRemaining===0){timerRunning=false;data.focusToday++;data.focusTotal++;save();render();if(view==='focus'){$('#timerStatus').textContent='WELL DONE · COMPLETE';$('#timerToggle').textContent='한 번 더 ↗';}return}updateTimerUI()},250);
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action],[data-view]');if(!btn)return;if(btn.dataset.view){navTo(btn.dataset.view);return}let act=btn.dataset.action;
if(act==='go-quiz'){quizSubject='all';quizState=null;navTo('quiz')}
else if(act==='subject-notes'){subjectFilter=btn.dataset.subject;noteId=notes.find(n=>n.s===subjectFilter).id;markRead(noteId);navTo('notes')}
else if(act==='delete-task'){data.tasks=data.tasks.filter(t=>t.id!==btn.dataset.task);save();render()}
else if(act==='filter'){subjectFilter=btn.dataset.subject;if(act==='filter'&&btn.dataset.mode==='notes'){noteId=notes.find(n=>subjectFilter==='all'||n.s===subjectFilter).id;markRead(noteId)}render()}
else if(act==='open-note'){noteId=btn.dataset.id;markRead(noteId);render()}
else if(act==='next-note'||act==='prev-note'){let list=notes.filter(n=>subjectFilter==='all'||n.s===subjectFilter);let at=list.findIndex(n=>n.id===noteId)+(act==='next-note'?1:-1);if(list[at]){noteId=list[at].id;markRead(noteId);render()}}
else if(act==='quiz-select'){quizSubject=btn.dataset.subject;render()}
else if(act==='start-current')startQuiz(quizSubject)
else if(act==='quiz-restart'){quizState=null;navTo('quiz')}
else if(act==='quiz-retry')startQuiz(quizSubject,quizMode,quizMode==='wrong'?quizState.ids:null)
else if(act==='answer')answer(Number(btn.dataset.option))
else if(act==='next-question'){if(!quizState)return;if(quizState.index+1>=quizState.ids.length)quizState.done=true;else {quizState.index++;quizState.selected=null;}render();window.scrollTo({top:0,behavior:'smooth'})}
else if(act==='review-all')startQuiz('all','wrong')
else if(act==='review-one')startQuiz('all','wrong',[btn.dataset.id])
else if(act==='set-time')setTimer(Number(btn.dataset.minutes))
else if(act==='timer-toggle')toggleTimer()
else if(act==='timer-reset')resetTimer();
});
document.addEventListener('change',e=>{if(e.target.matches('input[data-task]')){let t=data.tasks.find(x=>x.id===e.target.dataset.task);if(t){t.done=e.target.checked;save();render()}}});
document.addEventListener('submit',e=>{if(e.target.id==='taskForm'){e.preventDefault();let inp=$('#taskText'),value=inp.value.trim();if(!value)return;data.tasks.push({id:'task-'+Date.now()+'-'+Math.random().toString(36).slice(2,5),text:value.slice(0,70),done:false});save();render()}});
render();
</script>
</body>
</html>
